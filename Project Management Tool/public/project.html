<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project - CollaboBoard</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div id="project-app">
        <div class="sidebar">
            <div class="sidebar-header">CollaboBoard</div>
            <nav class="sidebar-nav">
                <a href="/dashboard" class="nav-item">Dashboard</a>
                <a href="#" class="nav-item">My Projects</a>
                <a href="#" class="nav-item">My Tasks</a>
                <a href="#" class="nav-item" id="nav-notifications">
                    Notifications <span id="notif-count" class="badge hidden">0</span>
                </a>
                <a href="#" class="nav-item">Profile</a>
                <a href="#" class="nav-item" id="logout-btn">Logout</a>
            </nav>
        </div>
        <div class="main-content">
            <header class="top-bar">
                <div class="container">
                    <div class="project-header" id="project-header"></div>
                    <div class="user-info" id="user-info"></div>
                </div>
            </header>
            <div class="container">
                <div class="board" id="board">
                    <!-- Columns will be rendered here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Task Modal -->
    <div class="modal-overlay hidden" id="task-modal">
        <div class="modal task-modal">
            <div class="modal-header">
                <h3 id="modal-task-title">Task Details</h3>
                <button class="btn-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Task details rendered dynamically -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modal-close-btn">Close</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div class="toast-container" id="toast-container"></div>

    <script src="/js/auth.js"></script>
    <script src="/js/project.js"></script>
</body>
</html>
