<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - CollabMeet</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <span class="logo-icon">CM</span>
          <span class="logo-text">CollabMeet</span>
        </div>
        <nav class="nav">
          <span id="userName" class="user-name"></span>
          <button id="logoutBtn" class="btn btn-secondary btn-small">Logout</button>
        </nav>
      </div>
    </header>

    <main class="main">
      <div class="container">
        <h1>My Meetings</h1>

        <div class="create-meeting-card">
          <h2>Create New Meeting</h2>
          <form id="createMeetingForm">
            <div class="form-group">
              <label for="meetingTitle">Title</label>
              <input type="text" id="meetingTitle" name="title" required />
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="meetingPassword">Password (optional)</label>
                <input type="password" id="meetingPassword" name="password" minlength="4" autocomplete="off" />
              </div>
              <div class="form-group">
                <label for="maxParticipants">Max Participants</label>
                <input type="number" id="maxParticipants" name="max_participants" value="50" min="2" max="100" />
              </div>
            </div>
            <div class="form-group">
              <label for="meetingDescription">Description (optional)</label>
              <textarea id="meetingDescription" name="description" rows="2"></textarea>
            </div>
            <div class="form-group">
              <label>
                <input type="checkbox" id="hasPassword" name="has_password" />
                Add password protection
              </label>
            </div>
            <button type="submit" class="btn btn-primary">Create Meeting</button>
          </form>
        </div>

        <div class="join-meeting-card">
          <h2>Join Meeting</h2>
          <form id="joinMeetingForm">
            <div class="form-row">
              <div class="form-group" style="flex: 2;">
                <label for="joinCode">Meeting Code</label>
                <input type="text" id="joinCode" name="meeting_code" placeholder="Enter code or UUID" required />
              </div>
              <div class="form-group" style="flex: 1;">
                <label for="joinPassword">Password (if protected)</label>
                <input type="password" id="joinPassword" name="password" autocomplete="off" />
              </div>
            </div>
            <button type="submit" class="btn btn-primary">Join Meeting</button>
          </form>
        </div>

        <div class="meetings-list" id="meetingsList">
          <h2>Your Meetings</h2>
          <div id="meetingsContainer">
            <p class="loading">Loading meetings...</p>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>&copy; 2024 CollabMeet. All rights reserved.</p>
    </footer>
  </div>

  <div id="copyModal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Meeting Created!</h3>
      </div>
      <div class="modal-body">
        <p>Share this link to invite participants:</p>
        <input type="text" id="meetingLink" readonly />
        <p style="margin-top: 10px;"><strong>Meeting Code:</strong> <span id="meetingCode"></span></p>
        <button id="copyLinkBtn" class="btn btn-primary">Copy Link</button>
      </div>
    </div>
  </div>

  <script src="/js/dashboard.js"></script>
</body>
</html>
